name: Deploy Backend (Supabase)

# Deploys database migrations and Edge Functions on every push to main.
# Requires repo secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
# (see docs/architecture.md).

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy ai-assist --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
